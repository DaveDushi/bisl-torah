# bisl-torah config

# Which Sefaria daily-calendar categories to rotate through.
# Use ["*"] for all categories.
categories = ["Halakhah", "Mishnah", "Chasidut"]

# "auto" = side-by-side when wide enough, stacked otherwise.
# Other options: "side-by-side", "stacked".
layout = "auto"

# Initial language pane. Toggle in-popup with b/h/e.
# Options: "both", "hebrew", "english".
default_lang = "both"

# Keep Hebrew vowel marks (nikud).
nikud = true

# Display host strategy.
# "auto" picks: wt-split when in Windows Terminal, tmux-popup when in tmux,
# else new-console.
# Override with: "wt-split", "tmux-popup", "new-console".
display = "auto"

# Popup pane sizing per display strategy. Values are percentages "10%"–"90%".
# wt_width: fraction of the parent Windows Terminal pane.
# tmux_width / tmux_height: floating popup size relative to the outer terminal.
[popup]
wt_width = "40%"
tmux_width = "80%"
tmux_height = "70%"
