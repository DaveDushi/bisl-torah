# Curated catalog of programs the user can quick-enroll in.
#
# `kind = "cycle"` programs hook into Sefaria's daily calendar; the
# `calendar_title` must match the `title.en` Sefaria returns from `/api/calendars`.
# `kind = "book"` programs walk a Sefaria text sequentially via the v3 next/prev refs.
# `unit` is "segment" (smallest unit; e.g. one mishnah, one se'if), "section" (one
# perek / one chapter), or "daf" (one Talmudic folio).

# ----- Cycle subscriptions -----

