[package]
name = "bisl-torah"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Learn while your coding agent runs. A side popup that shows daily Sefaria learning while Claude Code is thinking."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ddusi/bisl-torah"
homepage = "https://github.com/ddusi/bisl-torah"
keywords = ["claude-code", "sefaria", "tui", "torah", "halacha"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "bisl-torah"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
ratatui = "0.28"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-bidi = "0.3"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
